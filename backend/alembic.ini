# Alembic configuration for the Intentune Prototype 1 SQLite database.
#
# Run from backend/:  alembic upgrade head
#
# The database URL is NOT set here. env.py takes it from the DATABASE_URL
# environment variable, or defaults to backend/data/intentune.db; see
# src/intentune/persistence/db.py.

[alembic]
# path to migration scripts, relative to this file
script_location = %(here)s/alembic

# migration file names: date, revision id, slug
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# make backend/ importable (env.py imports src.intentune.persistence)
# whatever the working directory
prepend_sys_path = %(here)s

# use os.pathsep to split path lists
path_separator = os

# write revision files as utf-8
output_encoding = utf-8


[post_write_hooks]

# Logging configuration. env.py applies it for command-line runs only.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
